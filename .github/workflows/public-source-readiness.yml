name: Public source readiness

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: source-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install the independently pinned secret scanner
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/gitleaks"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          printf '%s  %s\n' 88f91962aa2f93ac6ab281d553b9e125f5197bbbce38f9f2437f7299c32e5509 "$RUNNER_TEMP/gitleaks/gitleaks" | sha256sum --check --strict
      - name: Audit reachable public history and original object contents
        shell: bash
        env:
          DOXENTRIQ_GITLEAKS_TEST_SHA256: 88f91962aa2f93ac6ab281d553b9e125f5197bbbce38f9f2437f7299c32e5509
        run: |
          export DOXENTRIQ_GITLEAKS_TEST_BINARY="$RUNNER_TEMP/gitleaks/gitleaks"
          python3 -I -B scripts/public-history-audit.test.py
          python3 -I -B scripts/public-history-audit.py --repo . \
            --gitleaks "$RUNNER_TEMP/gitleaks/gitleaks" \
            --gitleaks-sha256 "$DOXENTRIQ_GITLEAKS_TEST_SHA256" \
            --reviewed-fixtures scripts/public-history-reviewed-fixtures.json \
            --report "$RUNNER_TEMP/public-history-audit.json"
      - name: Verify the publication checks
        run: |
          python3 -I -B scripts/public-release-check.test.py
          python3 -I -B scripts/public-release-export.test.py
          python3 -I -B scripts/test-seed-backend-history.py
          python3 -I -B tests/test_company_seed_backend.py
      - name: Check tracked publication candidates
        run: python3 -I -B scripts/public-release-check.py --tracked-only

  linux-startup-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check quota readiness, Unix sockets and shutdown draining
        run: |
          sudo python3 -I -B scripts/test-quota-startup.py
          python3 -I -B scripts/test-quota-helper.py
          python3 -I -B scripts/test-host-network.py
          python3 -I -B scripts/test-maintenance-scanner-coverage.py
      - name: Check installer records and read-only root compatibility
        run: |
          AUTOSOFT_TEST_ARTIFACT_ROOT="$(mktemp -d "${RUNNER_TEMP}/doxentriq-records.XXXXXX")"
          export AUTOSOFT_TEST_ARTIFACT_ROOT
          python3 -I -B tests/test_company_cli_executed_record_store.py
          python3 -I -B tests/test_company_retention_records.py
          python3 -I -B tests/test_company_configuration.py
          python3 -I -B tests/test_company_foundation.py
          python3 -I -B tests/test_company_engine_elf.py
          python3 -I -B tests/test_company_release_producer.py
          sudo python3 -I -B tests/test_company_configuration_native.py
      - name: Check captured identity and source execution dependencies
        run: |
          AUTOSOFT_TEST_ARTIFACT_ROOT="$(mktemp -d "${RUNNER_TEMP}/doxentriq-source-controls.XXXXXX")"
          export AUTOSOFT_TEST_ARTIFACT_ROOT
          python3 -I -B scripts/test-identity.py
          python3 -I -B tests/test_bootstrap_render_hooks.py
          python3 -I -B tests/test_company_render_commands.py
          python3 -I -B tests/test_company_render_package.py
          python3 -I -B tests/test_identity_provisioning.py
          python3 -I -B tests/test_company_captured_loader.py
          python3 -I -B tests/test_company_full_package.py
          python3 -I -B tests/test_platform_foundation_materialize.py
          python3 -I -B tests/test_company_full_cli_package.py
          python3 -I -B tests/test_company_authenticated_cli_inputs.py
          python3 -I -B tests/test_company_authenticated_cli_compose.py
          python3 -I -B tests/test_company_signed_execute_preparation.py
          python3 -I -B tests/test_company_fixed_execute_child.py
          python3 -I -B tests/test_company_source_owned_execute.py
          python3 -I -B tests/test_company_startup_worker.py
      - name: Check foundation entry before host mutation
        shell: bash
        run: |
          DOXENTRIQ_NATIVE_TEST_ROOT=$(sudo mktemp -d /srv/doxentriq-entry.XXXXXX)
          # This fixture measures actual UID/GID against root installation state.
          sudo python3 -I -B tests/test_company_runtime_pair_worker.py
          sudo python3 -I -B tests/test_company_preparation_recovery.py
          sudo env DOXENTRIQ_NATIVE_TEST_ROOT="$DOXENTRIQ_NATIVE_TEST_ROOT" \
            python3 -I -B tests/test_company_preparation_entry_native.py
          sudo env DOXENTRIQ_NATIVE_TEST_ROOT="$DOXENTRIQ_NATIVE_TEST_ROOT" \
            python3 -I -B tests/test_company_foundation_entry_native.py
          sudo env DOXENTRIQ_NATIVE_TEST_ROOT="$DOXENTRIQ_NATIVE_TEST_ROOT" \
            python3 -I -B tests/test_company_foundation_packages.py
          sudo env DOXENTRIQ_NATIVE_TEST_ROOT="$DOXENTRIQ_NATIVE_TEST_ROOT" \
            python3 -I -B tests/test_company_engine_native.py
          sudo env DOXENTRIQ_NATIVE_TEST_ROOT="$DOXENTRIQ_NATIVE_TEST_ROOT" \
            python3 -I -B tests/test_company_engine_handoff.py
          sudo env DOXENTRIQ_NATIVE_TEST_ROOT="$DOXENTRIQ_NATIVE_TEST_ROOT" \
            python3 -I -B tests/test_company_engine_phase_native.py
          sudo env DOXENTRIQ_NATIVE_TEST_ROOT="$DOXENTRIQ_NATIVE_TEST_ROOT" \
            python3 -I -B tests/test_company_runtime_identity.py
          sudo env DOXENTRIQ_NATIVE_TEST_ROOT="$DOXENTRIQ_NATIVE_TEST_ROOT" \
            python3 -I -B tests/test_company_source_terminal_native.py
          sudo env DOXENTRIQ_PAIR_TEST_ROOT="$DOXENTRIQ_NATIVE_TEST_ROOT" \
            python3 -I -B tests/test_company_runtime_pair_native.py
          sudo env DOXENTRIQ_PAIR_TEST_ROOT="$DOXENTRIQ_NATIVE_TEST_ROOT" \
            python3 -I -B tests/test_company_runtime_pair_entry_native.py
          sudo env DOXENTRIQ_NATIVE_TEST_ROOT="$DOXENTRIQ_NATIVE_TEST_ROOT" \
            python3 -I -B tests/test_company_continuation_entry_native.py
          sudo env DOXENTRIQ_NATIVE_TEST_ROOT="$DOXENTRIQ_NATIVE_TEST_ROOT" \
            bash --noprofile --norc -c '
              set -euo pipefail
              # Raise only this test child to the original worker prerequisite.
              native_nofile=$(ulimit -Sn)
              if [[ "$native_nofile" != unlimited ]]; then
                [[ "$native_nofile" =~ ^[0-9]+$ ]] || exit 74
                if (( native_nofile < 4096 )); then ulimit -Sn 4096; fi
              fi
              exec python3 -I -B tests/test_company_native_retention.py
            '
          sudo env DOXENTRIQ_NATIVE_TEST_ROOT="$DOXENTRIQ_NATIVE_TEST_ROOT" \
            python3 -I -B tests/test_company_render_io_native.py
          sudo env DOXENTRIQ_NATIVE_TEST_ROOT="$DOXENTRIQ_NATIVE_TEST_ROOT" \
            python3 -I -B tests/test_company_render_openssl_native.py
          sudo env DOXENTRIQ_NATIVE_TEST_ROOT="$DOXENTRIQ_NATIVE_TEST_ROOT" \
            python3 -I -B tests/test_company_render_entry_native.py
          sudo env DOXENTRIQ_NATIVE_TEST_ROOT="$DOXENTRIQ_NATIVE_TEST_ROOT" \
            python3 -I -B tests/test_storage_fault_harness.py
          sudo python3 -I -B tests/test_storage_recovery_entry.py
      - name: Check private infrastructure, identity and quota composition
        shell: bash
        run: |
          DOXENTRIQ_NATIVE_TEST_ROOT=$(sudo mktemp -d /srv/doxentriq-initialization.XXXXXX)
          sudo env DOXENTRIQ_NATIVE_TEST_ROOT="$DOXENTRIQ_NATIVE_TEST_ROOT" \
            AUTOSOFT_TEST_ARTIFACT_ROOT="$DOXENTRIQ_NATIVE_TEST_ROOT" \
            bash --noprofile --norc -c '
              set -euo pipefail
              native_nofile=$(ulimit -Sn)
              if [[ "$native_nofile" != unlimited ]]; then
                [[ "$native_nofile" =~ ^[0-9]+$ ]] || exit 74
                if (( native_nofile < 16384 )); then ulimit -Sn 16384; fi
              fi
              # Engine-catalog and native-retention suites already run above.
              # Effects here use synthetic Docker; /etc changes are isolated
              # inside each native fixture mount namespace.
              for suite in test_company_identity_worker test_company_identity_ancestry_native \
                test_company_infrastructure_package test_company_initialization_entry_native \
                test_company_infrastructure_worker test_company_infrastructure_composition_native \
                test_company_infrastructure_host test_company_infrastructure_host_process_native \
                test_company_identity_closed_native test_company_quota_activation \
                test_company_quota_files_native test_company_quota_runtime_native \
                test_company_quota_effects_native test_company_quota_entry_native \
                test_installed_status_native \
                identity_components/test_identity_commands identity_components/test_identity_evidence \
                identity_components/test_identity_split; do
                python3 -I -B "tests/$suite.py"
              done
            '

  source-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install the locked public dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck, test and build
        run: npm run check
      - name: Check current public dependency advisories
        run: |
          python3 -I -B scripts/public-npm-advisories.py --lock package-lock.json --reviewed-public-packages models/platform-reviewed-public-npm.json
          python3 -I -B scripts/public-npm-advisories.py --lock templates/dms/package-lock.json --reviewed-public-packages models/dms-reviewed-public-npm.json
      - name: Set up the declared Go compiler
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/runtime/go.mod
          cache: false
      - name: Test and vet the runtime
        working-directory: services/runtime
        run: |
          go test ./...
          go vet ./...
