[global]
  server role = standalone server
  workgroup = WORKGROUP
  security = user
  map to guest = never
  server min protocol = SMB3_11
  server max protocol = SMB3_11
  server signing = mandatory
  server smb encrypt = required
  ntlm auth = ntlmv2-only
  smb ports = 445
  disable netbios = yes
  unix extensions = no
  load printers = no
  printcap name = /dev/null
  logging = stdout
  log level = 0
  passdb backend = smbpasswd:/run/samba/smbpasswd
  lock directory = /run/samba
  state directory = /run/samba
  cache directory = /run/samba
  private dir = /run/samba
  pid directory = /run/samba
[documents]
  path = /share
  valid users = smbreader
  read only = yes
  follow symlinks = no
  wide links = no
  server smb encrypt = required
