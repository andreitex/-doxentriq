listeners.tcp = none
listeners.ssl.default = 5671
ssl_options.cacertfile = /etc/autosoft/tls/ca.crt
ssl_options.certfile = /etc/autosoft/tls/rabbitmq.crt
ssl_options.keyfile = /etc/autosoft/tls/rabbitmq.key
ssl_options.verify = verify_none
ssl_options.fail_if_no_peer_cert = false
ssl_options.versions.1 = tlsv1.3
ssl_options.versions.2 = tlsv1.2
management.ssl.port = 15671
management.ssl.cacertfile = /etc/autosoft/tls/ca.crt
management.ssl.certfile = /etc/autosoft/tls/rabbitmq.crt
management.ssl.keyfile = /etc/autosoft/tls/rabbitmq.key
management.ssl.verify = verify_none
management.ssl.fail_if_no_peer_cert = false
prometheus.tcp.listener = none
prometheus.ssl.port = 15691
prometheus.ssl.cacertfile = /etc/autosoft/tls/ca.crt
prometheus.ssl.certfile = /etc/autosoft/tls/rabbitmq.crt
prometheus.ssl.keyfile = /etc/autosoft/tls/rabbitmq.key
load_definitions = /etc/rabbitmq/definitions.json
consumer_timeout = 900000
log.console = true
log.console.level = warning
