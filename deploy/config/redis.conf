bind 0.0.0.0
port 0
tls-port 6379
tls-cert-file /etc/autosoft/tls/redis.crt
tls-key-file /etc/autosoft/tls/redis.key
tls-ca-cert-file /etc/autosoft/tls/ca.crt
tls-auth-clients no
tls-protocols "TLSv1.2 TLSv1.3"
aclfile /data/users.acl
appendonly yes
appendfsync everysec
dir /data
protected-mode yes
maxmemory 512mb
maxmemory-policy allkeys-lru
